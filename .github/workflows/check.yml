name: Check
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, aarch64-linux-android
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --features server --all-targets -- -D warnings
      - run: cargo clippy --locked --target wasm32-unknown-unknown --bin jarcade -- -D warnings
      - name: Android check with the runner's NDK
        run: |
          ndk_path="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          test -n "$ndk_path"
          export CC_aarch64_linux_android="$ndk_path/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android23-clang"
          export AR_aarch64_linux_android="$ndk_path/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          cargo clippy --locked --target aarch64-linux-android --bin jarcade -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/*.test.cjs
      - run: cargo test --locked --features server
      - run: cargo build --locked --release --features server --bins
      - run: bash scripts/build-web.sh
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
          components: clippy
      - run: cargo clippy --locked --target aarch64-apple-ios --bin jarcade -- -D warnings
